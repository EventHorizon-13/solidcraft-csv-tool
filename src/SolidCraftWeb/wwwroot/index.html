<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141b18" media="(prefers-color-scheme: dark)">
  <title>标准辊密封批量生成</title>
  <link rel="stylesheet" href="/styles.css?v=20261031-modal">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="标准辊密封首页">
    <span>标准辊密封批量生成</span>
  </a>
  <div class="connection">
    <span id="connectionState" role="status">正在连接…</span>
    <input id="apiToken" aria-label="API 访问令牌" type="password" autocomplete="off" placeholder="访问令牌">
    <button id="connectBtn" type="button">连接</button>
  </div>
</header>
<main class="workspace">
  <section class="work-area">
    <div class="workspace-heading">
      <div class="toolbar">
        <input id="csvFile" type="file" accept=".csv,text/csv" hidden>
        <button id="importBtn" type="button">导入 CSV</button>
        <button id="addBtn" type="button">＋ 新增一行</button>
        <button id="validateBtn" type="button">检查参数</button>
      </div>
      <span id="rowCount" hidden>0 行</span>
    </div>
    <section class="table-panel" aria-label="参数表">
      <div class="table-wrap"><table id="grid" aria-label="辊密封参数表"><thead></thead><tbody></tbody></table></div>
      <div class="table-footer"><span>单位 mm</span><span>支持粘贴 Excel / WPS 多格数据</span></div>
    </section>
    <details class="job panel" id="jobPanel">
      <summary class="section-heading job-summary"><h2>任务进度</h2><strong id="jobState">未开始</strong></summary>
      <div class="job-body">
        <div class="job-status" id="jobMessage">参数就绪后，选择右侧输出格式。</div>
        <progress id="jobProgress" value="0" max="1" aria-label="生成进度" hidden></progress>
        <div class="actions job-actions" id="jobActions" hidden><button id="cancelBtn" type="button" disabled hidden>取消任务</button><a id="downloadBtn" class="button-link disabled" aria-disabled="true" hidden>下载结果</a></div>
        <details class="log-details"><summary>运行日志</summary><pre id="log" aria-live="polite"></pre></details>
      </div>
    </details>
  </section>
  <aside class="settings panel">
    <div class="section-heading"><h2>输出设置</h2><span class="format-mark">A4 · mm</span></div>
    <div class="fields">
      <label>隐藏线比例<input id="hiddenLineScale" type="number" min="0.05" max="100" step="0.05" value="2"></label>
      <label>视图间距 mm<input id="viewGap" type="number" min="10" max="5000" step="1"></label>
    </div>    <p class="output-note">导出自动附零件编号；PDF 按页等比例输出。</p>
    <section class="quick-output" aria-labelledby="quickHeading">
      <h3 id="quickHeading">快速输出</h3>
      <div class="export-actions"><button id="dxfBtn" type="button">输出 DXF <span aria-hidden="true">↗</span></button><button id="pdfBtn" type="button" class="primary">输出 PDF <span aria-hidden="true">↗</span></button></div>
    </section>
    <section class="project-output" aria-labelledby="projectHeading">
      <h3 id="projectHeading">项目输出</h3>
      <div class="project-checks">
        <label><input id="exportDxf" type="checkbox">导出 DXF</label>
        <label><input id="exportStep" type="checkbox" checked>导出 STEP</label>
        <label><input id="combineStep" type="checkbox">合并 STEP</label>
        <label><input id="exportPdf" type="checkbox">导出 PDF</label>
        <label class="field-wide"><input id="exportCsv" type="checkbox">导出列表 CSV</label>
      </div>
      <div class="fields"><label class="field-wide">合并 STEP 文件名<input id="stepName" type="text" maxlength="180"></label></div>
      <button id="stepBtn" type="button" class="step-button primary">输出项目 ZIP</button>
    </section>
  </aside>
</main>
<script src="/app.js?v=20261031-modal" defer></script>
</body>
</html>
