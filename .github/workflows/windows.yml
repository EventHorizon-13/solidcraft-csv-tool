name: Windows EXE
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', 'README.md', 'build.ps1', 'THIRD_PARTY_NOTICES.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set release identity
        shell: pwsh
        run: |
          "BUILD_VERSION=1.0.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd')
          "BUILD_DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check dimensions, build identity and core behavior
        shell: pwsh
        run: |
          dotnet run --project tests/CoreChecks.csproj -c Release "-p:Version=$env:BUILD_VERSION" "-p:BuildDate=$env:BUILD_DATE" -- dist/checks
          if ($LASTEXITCODE -ne 0) { throw 'Checks failed' }
      - name: Publish self contained Windows application
        run: dotnet publish src/SolidCraftCsvTool/SolidCraftCsvTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false "-p:Version=$env:BUILD_VERSION" "-p:BuildDate=$env:BUILD_DATE" -o dist/app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit native DXF with an independent reader
        run: |
          python -m pip install ezdxf
          python tools/check-dimensions.py dist/checks/annotated-sample.dxf
      - name: Prepare binary-only dependencies for local private drawing conversion
        if: always()
        run: python -m pip download --platform manylinux2014_aarch64 --platform manylinux_2_17_aarch64 --platform manylinux_2_27_aarch64 --platform manylinux_2_28_aarch64 --implementation cp --abi cp311 --python-version 3.11 --only-binary=:all: --dest dist/checks/linux-wheels ezdxf==1.4.5
      - name: Smoke check Windows window
        shell: pwsh
        run: |
          $process = Start-Process dist/app/SolidCraftCsvTool.exe -ArgumentList '--smoke-test', '--screenshot', "$env:GITHUB_WORKSPACE/dist/checks/window.png" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Windows smoke check timed out' }
          if ($process.ExitCode -ne 0) { throw 'Windows smoke check failed' }
      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md dist/app/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/app/THIRD_PARTY_NOTICES.md
          Compress-Archive -Path dist/app/* -DestinationPath dist/SolidCraftCsvTool-win-x64.zip
          $hash = (Get-FileHash dist/SolidCraftCsvTool-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SolidCraftCsvTool-win-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          @"
          标准辊密封批量生成 $env:BUILD_VERSION，编译日期 $env:BUILD_DATE。
          Windows 10/11 x64，解压后双击 SolidCraftCsvTool.exe。
          自包含发布，不需要安装 Python 或 .NET。需要 SolidCraft 桌面版与 V13 模板。
          STEP 加工图按文件名排序，纵向排入一个汇总 DXF，每张图标注序号和文件名。
          按参考图样增加总长、宽、高、圆槽中心距、槽口、端部及台阶分段尺寸；尺寸线青色、文字绿色。
          输出可编辑的 CAD DIMENSION 尺寸对象，单位 mm；尺寸由 STEP 投影几何提取，加工前请核对。
          标题栏显示产品名称、发行版本与编译日期，沿用隐藏圆弧拟合修复。
          DXF 升级到 AutoCAD 2010（AC1024），由 netDxf 生成完整对象引用和 Unicode 文本，保留可编辑尺寸；通过双库读取及版本检查。
          本次构建未连接真实 SolidCraft 桌面端，未生成 CAD 模型。
          源码提交：$env:GITHUB_SHA
          "@ | Set-Content dist/release-notes.md -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: SolidCraftCsvTool-win-x64
          path: |
            dist/SolidCraftCsvTool-win-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 30
      - name: Publish downloadable Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "win-1.0.${{ github.run_number }}" dist/SolidCraftCsvTool-win-x64.zip dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Windows 1.0.${{ github.run_number }}" --notes-file dist/release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dimension-checks
          path: dist/checks/
          if-no-files-found: ignore
          retention-days: 14
