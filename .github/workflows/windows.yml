name: Windows EXE
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', 'README.md', 'build.ps1', 'THIRD_PARTY_NOTICES.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set release identity
        shell: pwsh
        run: |
          "BUILD_VERSION=1.0.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd HH:mm:ss')
          "BUILD_DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check only requested drawing annotation changes
        shell: pwsh
        run: |
          dotnet run --project tests/CoreChecks.csproj -c Release "-p:Version=$env:BUILD_VERSION" "-p:BuildDate=$env:BUILD_DATE" -- --front-height-check dist/checks
          if ($LASTEXITCODE -ne 0) { throw 'Drawing annotation check failed' }
      - name: Publish self contained Windows application
        run: dotnet publish src/SolidCraftCsvTool/SolidCraftCsvTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false "-p:Version=$env:BUILD_VERSION" "-p:BuildDate=$env:BUILD_DATE" -o dist/app
      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md dist/app/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/app/THIRD_PARTY_NOTICES.md
          Compress-Archive -Path dist/app/* -DestinationPath dist/SolidCraftCsvTool-win-x64.zip
          @"
          标准辊密封批量生成 $env:BUILD_VERSION，编译日期 $env:BUILD_DATE。
          Windows 10/11 x64，解压后双击 SolidCraftCsvTool.exe。
          自包含发布，不需要安装 Python 或 .NET。需要 SolidCraft 桌面版与 V13 模板。
          STEP 加工图按文件名排序，纵向排入一个汇总 DXF，图名仅显示辊密封和编号。
          主视图右侧不标注尺寸，左侧仅标注总高度。
          上视图取消多余的 1.11 mm 子头尺寸，保留其他尺寸。
          孔径使用原生直径尺寸；左视图仅保留宽、高及斜角；俯视图子母槽分端标注。
          图名简化放大，使用 gbenor.shx 与 gbcbig.shx；模板其他字体保留；编译时间精确到秒。
          输出可编辑的 CAD DIMENSION 尺寸对象，单位 mm；尺寸由 STEP 投影几何提取，加工前请核对。
          统一第一角投影，主视图右侧为左视图；支持本地 DXF 模板图框、标题栏及自选标注样式（默认 _5）。
          隐藏线采用清晰的 6/3 线型并支持比例设置；视图、标注和图框按实际边界留白排版。
          标题栏显示产品名称、发行版本与编译日期，沿用隐藏圆弧拟合修复。
          DXF 升级到 AutoCAD 2010（AC1024），由 netDxf 生成完整对象引用和 Unicode 文本，保留可编辑尺寸。
          本次构建未连接真实 SolidCraft 桌面端，未生成 CAD 模型。
          源码提交：$env:GITHUB_SHA
          "@ | Set-Content dist/release-notes.md -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: SolidCraftCsvTool-win-x64
          path: |
            dist/SolidCraftCsvTool-win-x64.zip
          retention-days: 30
      - name: Publish downloadable Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "win-1.0.${{ github.run_number }}" dist/SolidCraftCsvTool-win-x64.zip --target "$env:GITHUB_SHA" --title "Windows 1.0.${{ github.run_number }}" --notes-file dist/release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dimension-checks
          path: dist/checks/
          if-no-files-found: ignore
          retention-days: 14
