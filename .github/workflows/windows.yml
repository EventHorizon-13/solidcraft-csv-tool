name: Build and release 2.4.0
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: win-x64
            solidcraft_arch: x64
            node_arch: x64
            output: dist/app
          - arch: arm64
            rid: win-arm64
            solidcraft_arch: arm64
            node_arch: arm64
            output: dist/app-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Set release identity
        shell: pwsh
        run: |
          "BUILD_VERSION=2.4.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd HH:mm:ss')
          "BUILD_DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install open-source PDF renderer
        shell: pwsh
        run: npm install --prefix tools/pdf-export --ignore-scripts --no-audit --no-fund
      - name: Bundle official SolidCraft CLI
        shell: pwsh
        run: |
          $archive = "dist/solidcraft-${{ matrix.solidcraft_arch }}.zip"
          New-Item -ItemType Directory -Force dist/official, "${{ matrix.output }}/SolidCraft" | Out-Null
          Invoke-WebRequest "https://github.com/tangency-labs/solidcraft/releases/download/v0.23.0/solidcraft-0.23.0-windows-${{ matrix.solidcraft_arch }}-portable.zip" -OutFile $archive
          Expand-Archive $archive dist/official -Force
          $cli = Get-ChildItem dist/official -Recurse -Filter solidcraft-cli.exe | Select-Object -First 1
          if (-not $cli) { throw 'Official SolidCraft package has no CLI executable' }
          Copy-Item (Join-Path $cli.DirectoryName '*') "${{ matrix.output }}/SolidCraft" -Recurse
          Remove-Item "${{ matrix.output }}/SolidCraft/solidcraft.exe" -ErrorAction SilentlyContinue
          foreach ($notice in @('LICENSE-MIT','LICENSE-APACHE','NOTICE','THIRD-PARTY-LICENSES.txt')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/tangency-labs/solidcraft/v0.23.0/$notice" -OutFile "${{ matrix.output }}/SolidCraft/$notice"
          }
      - name: Bundle open-source Node.js runtime and PDF renderer
        shell: pwsh
        run: |
          $nodeVersion = (node --version).Trim()
          $nodeArchive = "node-$nodeVersion-win-${{ matrix.node_arch }}.zip"
          New-Item -ItemType Directory -Force dist/node, "${{ matrix.output }}/PdfExporter" | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/$nodeArchive" -OutFile "dist/$nodeArchive"
          Expand-Archive "dist/$nodeArchive" dist/node -Force
          $nodeExe = Get-ChildItem dist/node -Recurse -Filter node.exe | Select-Object -First 1
          $nodeLicense = Get-ChildItem dist/node -Recurse -Filter LICENSE | Select-Object -First 1
          if (-not $nodeExe -or -not $nodeLicense) { throw 'Node.js runtime archive is incomplete' }
          Copy-Item $nodeExe.FullName "${{ matrix.output }}/PdfExporter/node.exe"
          Copy-Item $nodeLicense.FullName "${{ matrix.output }}/PdfExporter/LICENSE-Node.js"
          node tools/pdf-export/build-bundle.mjs "${{ matrix.output }}/PdfExporter"
      - name: Publish Windows desktop preview
        shell: pwsh
        run: |
          dotnet publish src/SolidCraftCsvTool/SolidCraftCsvTool.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false "-p:Version=$env:BUILD_VERSION" "-p:BuildDate=$env:BUILD_DATE" -o '${{ matrix.output }}'
          if ($LASTEXITCODE -ne 0) { throw 'Windows release publish failed' }
          Copy-Item README.md, THIRD_PARTY_NOTICES.md '${{ matrix.output }}/'
          Copy-Item '模板/*' '${{ matrix.output }}/模板/' -Recurse -Force
          Copy-Item tools/pdf-export/fonts.json.example '${{ matrix.output }}/模板/字体/fonts.json.example'
          Copy-Item examples/辊密封参数模板.csv '${{ matrix.output }}/辊密封参数模板.csv'
          $expandedBytes = (Get-ChildItem '${{ matrix.output }}' -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Output "UNCOMPRESSED_PACKAGE_BYTES=$expandedBytes"
          Write-Output "UNCOMPRESSED_PACKAGE_MIB=$([math]::Round($expandedBytes / 1MB, 1))"
          Compress-Archive -Path '${{ matrix.output }}/*' -DestinationPath 'dist/StandardRollerSeal-windows-${{ matrix.arch }}.zip' -Force
      - name: Check Windows layout at normal and minimum size
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/checks | Out-Null
          $app = Join-Path (Resolve-Path '${{ matrix.output }}') '标准辊密封批量生成.exe'
          $normal = Join-Path $env:GITHUB_WORKSPACE 'dist/checks/window.png'
          $minimum = Join-Path $env:GITHUB_WORKSPACE 'dist/checks/minimum.png'
          $process = Start-Process $app -ArgumentList '--smoke-test', '--screenshot', $normal, '--minimum-screenshot', $minimum, '--dark-screenshot', (Join-Path $env:GITHUB_WORKSPACE 'dist/checks/dark.png'), '--about-screenshot', (Join-Path $env:GITHUB_WORKSPACE 'dist/checks/about.png'), '--update-prompt-screenshot', (Join-Path $env:GITHUB_WORKSPACE 'dist/checks/update-prompt.png'), '--settings-screenshot', (Join-Path $env:GITHUB_WORKSPACE 'dist/checks/drawing-settings.png') -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Window layout check timed out' }
          if ($process.ExitCode -ne 0) { Get-Content (Join-Path (Split-Path $app) 'smoke-error.txt') -ErrorAction SilentlyContinue; throw 'Window layout check failed' }
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'amd64'
        with:
          name: UI-previews
          path: dist/checks/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: StandardRollerSeal-windows-${{ matrix.arch }}
          path: dist/StandardRollerSeal-windows-${{ matrix.arch }}.zip
          retention-days: 30

  linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            solidcraft_arch: x86_64
            node_arch: x64
          - arch: arm64
            rid: linux-arm64
            solidcraft_arch: aarch64
            node_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Set release identity
        shell: bash
        run: |
          echo "BUILD_VERSION=2.4.0" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
      - name: Install open-source PDF renderer
        run: npm install --prefix tools/pdf-export --ignore-scripts --no-audit --no-fund
      - name: Bundle official SolidCraft CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/official dist/app/SolidCraft
          archive="solidcraft-0.23.0-linux-${{ matrix.solidcraft_arch }}.tar.gz"
          curl --fail --location "https://github.com/tangency-labs/solidcraft/releases/download/v0.23.0/$archive" --output "dist/$archive"
          tar -xzf "dist/$archive" -C dist/official
          cli="$(find dist/official -type f -name solidcraft-cli -print -quit)"
          test -n "$cli"
          install -m 755 "$cli" dist/app/SolidCraft/solidcraft-cli
          for notice in LICENSE-MIT LICENSE-APACHE NOTICE THIRD-PARTY-LICENSES.txt; do
            curl --fail --location "https://raw.githubusercontent.com/tangency-labs/solidcraft/v0.23.0/$notice" --output "dist/app/SolidCraft/$notice"
          done
      - name: Bundle open-source Node.js runtime and PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          archive="node-${node_version}-linux-${{ matrix.node_arch }}.tar.xz"
          curl --fail --location "https://nodejs.org/dist/${node_version}/${archive}" --output "dist/${archive}"
          mkdir -p dist/node dist/app/PdfExporter
          tar -xJf "dist/${archive}" -C dist/node
          node_dir="$(find dist/node -mindepth 1 -maxdepth 1 -type d -name 'node-*' -print -quit)"
          install -m 755 "${node_dir}/bin/node" dist/app/PdfExporter/node
          cp "${node_dir}/LICENSE" dist/app/PdfExporter/LICENSE-Node.js
          node tools/pdf-export/build-bundle.mjs dist/app/PdfExporter
      - name: Publish Linux CLI preview
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/SolidCraftCli/SolidCraftCli.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false "-p:Version=$BUILD_VERSION" -o dist/app
          cp README.md THIRD_PARTY_NOTICES.md dist/app/
          cp -R 模板/. dist/app/模板/
          cp tools/pdf-export/fonts.json.example dist/app/模板/字体/fonts.json.example
          cp examples/辊密封参数模板.csv dist/app/辊密封参数模板.csv
          expanded_bytes=$(du -sb dist/app | cut -f1)
          echo "UNCOMPRESSED_PACKAGE_BYTES=$expanded_bytes"
          awk -v bytes="$expanded_bytes" 'BEGIN { printf "UNCOMPRESSED_PACKAGE_MIB=%.1f\n", bytes / 1048576 }'
          tar -czf "dist/StandardRollerSeal-linux-${{ matrix.arch }}.tar.gz" -C dist/app .
      - uses: actions/upload-artifact@v4
        with:
          name: StandardRollerSeal-linux-${{ matrix.arch }}
          path: dist/StandardRollerSeal-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30

  publish-release:
    needs: [windows, linux-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: StandardRollerSeal-*
          path: dist/release-assets
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/release-assets/StandardRollerSeal-*)
          if [ "${#files[@]}" -ne 4 ]; then
            printf 'Expected four architecture packages, found %s\n' "${#files[@]}"
            exit 1
          fi
          tag="win-2.4.0"
          title="标准辊密封批量生成 2.4.0"
          cat > dist/release-notes.md <<EOF
          标准辊密封批量生成 2.4.0 正式版。

          - 新增生成 .solidcraft 模型时在同一后台会话直接提取前视、俯视、左视，无需关闭并重新打开模型。
          - DXF-only 模式跳过单件 STEP 中间文件，减少重复导出和模型加载；保留组合 STEP 与独立模型出图。
          - 参数表支持 WPS 风格填充柄，单个单元格与连续矩形选区均可填充；支持上下左右及二维拖动。
          - 拖动期间实时预览目标范围和填充结果；松开鼠标提交，取消拖动恢复原值。
          - 支持数字、日期和编号后缀序列；按住 Ctrl 可切换序列填充与循环复制。
          - 支持 Ctrl+Z 撤销、Ctrl+Y / Ctrl+Shift+Z 重做，覆盖填充、单元格编辑、整列修改、勾选切换和行操作。
          - 勾选框单击即可切换；双击勾选列列头全选/取消全选，双击其他列头可批量修改整列。
          - 移除可编辑的配合间隙列；旧版 14 列和 19 列 CSV 仍可导入，末尾间隙值会被忽略，模板内部公式保持不变。
          - 深色模式采用更柔和的选中行颜色，当前单元格使用高对比度外框；浅色与自动主题同步适配。
          - 更新确认窗口适配深浅色主题；关于窗口与设置选项卡的布局、对齐和高亮得到改进。
          - 日志区域默认高度增至 140，并加入可拖动分隔条。
          - Windows 2022 / Windows 2025 自动验证填充、撤销/重做、选中单元格边框、主题和窗口布局。
          - Windows 桌面版：amd64、arm64；Linux CLI：amd64、arm64。
          - PDF 使用开源 DXF 矢量渲染；不包含 ODA 或专有 SDK。
          - PDF 需要用户提供有使用授权的 gbenor.shx、gbcbig.shx 和固定 A4 DXF 图框。
          - PDF 文字按矢量轮廓输出；DXF 保持可编辑。正式加工前请核对实际图纸。

          源码提交：$GITHUB_SHA
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes-file dist/release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file dist/release-notes.md
          fi
