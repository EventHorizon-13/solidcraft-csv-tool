name: Windows EXE
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', 'README.md', 'build.ps1', 'THIRD_PARTY_NOTICES.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set release identity
        shell: pwsh
        run: |
          "BUILD_VERSION=1.1.2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd HH:mm:ss')
          "BUILD_DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundle official SolidCraft 0.23 CLI and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-WebRequest 'https://github.com/tangency-labs/solidcraft/releases/download/v0.23.0/solidcraft-0.23.0-windows-x64-portable.zip' -OutFile dist/solidcraft-official.zip
          Expand-Archive dist/solidcraft-official.zip dist/official
          $cli = Get-ChildItem dist/official -Recurse -Filter solidcraft-cli.exe | Select-Object -First 1
          if (-not $cli) { throw 'Official package has no CLI' }
          New-Item -ItemType Directory -Force dist/app/SolidCraft | Out-Null
          Copy-Item (Join-Path $cli.DirectoryName '*') dist/app/SolidCraft -Recurse
          Remove-Item dist/app/SolidCraft/solidcraft.exe -ErrorAction SilentlyContinue
          foreach ($notice in @('LICENSE-MIT','LICENSE-APACHE','NOTICE','THIRD-PARTY-LICENSES.txt')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/tangency-labs/solidcraft/v0.23.0/$notice" -OutFile "dist/app/SolidCraft/$notice"
          }
      - name: Publish self contained Windows application
        run: dotnet publish src/SolidCraftCsvTool/SolidCraftCsvTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false "-p:Version=$env:BUILD_VERSION" "-p:BuildDate=$env:BUILD_DATE" -o dist/app
      - name: Check compact Windows layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/checks | Out-Null
          $process = Start-Process dist/app/标准辊密封批量生成.exe -ArgumentList '--smoke-test', '--screenshot', "$env:GITHUB_WORKSPACE/dist/checks/window.png", '--about-screenshot', "$env:GITHUB_WORKSPACE/dist/checks/about.png", '--minimum-screenshot', "$env:GITHUB_WORKSPACE/dist/checks/minimum.png" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Compact layout check timed out' }
          if ($process.ExitCode -ne 0) { throw 'Compact layout check failed' }
      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md dist/app/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/app/THIRD_PARTY_NOTICES.md
          Copy-Item 模板 dist/app/模板 -Recurse
          Copy-Item examples/辊密封参数模板.csv dist/app/辊密封参数模板.csv
          Copy-Item examples/辊密封参数模板.csv dist/roller-seal-template.csv
          Compress-Archive -Path dist/app/* -DestinationPath dist/SolidCraftRollerSeal-win-x64.zip
          @"
          标准辊密封批量生成 $env:BUILD_VERSION，编译于 $env:BUILD_DATE。
          程序文件名：标准辊密封批量生成.exe。
          固定使用随包附带的官方 SolidCraft 0.23 CLI，无窗口自动启动与退出；无需手动启动桌面版。请完整解压全部文件夹。
          新增可记住的“完成后打开 DXF”选项：生成成功后用默认软件打开，取消或失败不打开。
          生成并导出Step / 一键生成并导出 DXF；支持合并 STEP 和导出当前任务 CSV 开关。
          汇总 DXF、组合 STEP 文件名可独立设置，默认辊密封_MMDD；单件命名辊密封_MMDD_编号。
          CSV 同输出文件夹，默认辊密封_MMDD.csv，附带6行参数模板。
          生成与停止按钮位于底部右侧，操作行自动撑高，避免底部截断；选中单元格蓝框，说明位于进度条左侧，SolidCraft模板标签。
          加入用户批准的实心液态玻璃图标与右对齐关于按钮；标题栏仅保留版本号；关于界面去掉重复标题，版本下增加作者 EventHorizon-13 及 GitHub 主页链接，保留编译时间和许可。
          去掉图框内重复大图名，只在标题栏保留辊密封编号；图框和标题栏字体 gbenor/gbcbig。
          仍支持桌面版自动启动；后台运行不操作或关闭已打开的桌面窗口。
          CSV新增子头宽、子头突出、母槽宽、母槽深、配合间隙，空白逐行恢复模板默认值；软件目录/模板自动识别V13和DXF。
          固定无窗口后台自动运行，不提供后台运行开关。
          本次仅检查紧凑界面布局：文件名并排、生成/停止与底部选项同行、单元格边框、说明位于进度条左侧及关于界面。端口固定7878，组合间距固定10mm；不运行全量测试或 SHA-256 校验。
          源码提交：$env:GITHUB_SHA
          "@ | Set-Content dist/release-notes.md -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: SolidCraftRollerSeal-win-x64
          path: |
            dist/SolidCraftRollerSeal-win-x64.zip
            dist/roller-seal-template.csv
          retention-days: 30
      - name: Publish downloadable Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "win-$env:BUILD_VERSION" dist/SolidCraftRollerSeal-win-x64.zip dist/roller-seal-template.csv --target "$env:GITHUB_SHA" --title "Windows $env:BUILD_VERSION" --notes-file dist/release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dimension-checks
          path: dist/checks/
          if-no-files-found: ignore
          retention-days: 14
